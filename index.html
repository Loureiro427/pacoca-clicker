<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Paçoca Clicker</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div id="app">
      <!-- Status Bar com Tipografia 3D -->
      <header class="status-bar">
        <div class="header-logo">
          <img src="/pacoca.png" alt="Paçoca" class="header-mascot">
        </div>
        <div class="header-stats">
          <h1 id="score-display">0</h1>
          <p id="pps-display">0 por segundo</p>
        </div>
      </header>

      <!-- Banner de Frenesi Dourado -->
      <div id="frenzy-banner" class="frenzy-banner">
        🔥 FRENESI 7X ATIVO: <span id="frenzy-timer">20</span>s
      </div>

      <!-- Aba 1: Tocar com Chuva de Fundo e Onda na Base -->
      <main id="click-area" class="tab-content active">
        <!-- Container de chuva de mini paçocas -->
        <div id="bg-rain-container" class="bg-rain"></div>

        <!-- Mascote Central e Brilho -->
        <div class="mascot-container">
          <div class="shine"></div>
          <img src="/pacoca.png" id="pacoca-button" class="pacoca-mascot" alt="Mascote Paçoca" draggable="false" ondragstart="return false;" oncontextmenu="return false;">
        </div>

        <!-- Onda de Creme na base (Estilo Cookie Clicker) -->
        <div class="cream-wave">
          <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="#ffffff" fill-opacity="1" d="M0,192L48,197.3C96,203,192,213,288,197.3C384,181,480,139,576,144C672,149,768,203,864,218.7C960,235,1056,213,1152,192C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
          </svg>
        </div>
      </main>

      <!-- Aba 2: Loja estilo Cookie Clicker -->
      <section id="shop-area" class="tab-content"></section>

      <!-- Aba 3: Melhorias -->
      <section id="upgrades-area" class="tab-content">
        <div class="shop-header">
          <h2>Melhorias</h2>
        </div>
        <div id="upgrades-list" class="shop-list"></div>
      </section>

      <!-- Aba 4: Perfil -->
      <section id="profile-area" class="tab-content">
        <div class="profile-section">
          <h2>Estatísticas</h2>
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-label">Cliques Totais</span>
              <strong id="stat-clicks">0</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Total Acumulado</span>
              <strong id="stat-earned">0</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Estruturas</span>
              <strong id="stat-structures">0</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Tempo de Jogo</span>
              <strong id="stat-time">0m</strong>
            </div>
          </div>
        </div>

        <div class="profile-section" style="margin-top: 20px;">
          <h2>Conquistas</h2>
          <div id="achievements-list" class="shop-list"></div>
        </div>

        <div class="profile-section" style="margin-top: 20px;">
          <h2>Dados e Salvamento</h2>
          <div class="save-actions">
            <button id="btn-export-save" class="action-btn secondary">Exportar Save</button>
            <button id="btn-import-save" class="action-btn secondary">Importar Save</button>
            <button id="btn-reset-save" class="action-btn danger">Resetar Progresso</button>
          </div>
        </div>
      </section>

      <!-- Navegação Inferior 3D -->
      <nav class="bottom-nav">
        <button class="nav-btn active" data-target="click-area">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
          </svg>
          <span class="label">Tocar</span>
        </button>
        <button class="nav-btn" data-target="shop-area">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="2"></rect>
            <rect x="14" y="3" width="7" height="7" rx="2"></rect>
            <rect x="14" y="14" width="7" height="7" rx="2"></rect>
            <rect x="3" y="14" width="7" height="7" rx="2"></rect>
          </svg>
          <span class="label">Loja</span>
        </button>
        <button class="nav-btn" data-target="upgrades-area">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span class="label">Melhorias</span>
        </button>
        <button class="nav-btn" data-target="profile-area">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="label">Perfil</span>
        </button>
      </nav>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
